[package]
name = "mind_mapper"
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
# Pictures on nodes are stored in map files as base64 data URLs.
base64 = "0.22.1"
eframe = { version = "0.37.0", features = ["persistence"] }
# Reading and resizing PNG and JPEG pictures on nodes (eframe already uses it for PNG).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
epaint_default_fonts = "0.37.0"
# PNG export, including pictures on nodes (no system fonts: the built-in font is used).
resvg = { version = "0.50.0", default-features = false, features = ["text", "raster-images"] }
# PDF export: vector drawing with the built-in font embedded, plus pictures on nodes.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
rfd = "0.18.0"
# XML parsing for OPML and FreeMind files (already used by resvg, so no extra download).
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
# Measuring label widths for PDF export (already used by resvg's font handling).
ttf-parser = "0.25.1"
# HTTPS for the update check (rustls with Mozilla's root certificates; no gzip needed).
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

# Small, fast release binary.
[profile.release]
lto = true
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
