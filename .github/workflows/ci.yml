name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is real ARM64 hardware, so the tests run there natively.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      # Start the release build on a virtual screen and check it is still running after 15
      # seconds instead of crashing at startup. The runners have no GPU, so Mesa's
      # software Vulkan (lavapipe) and EGL drivers give wgpu something to draw with.
      - name: Smoke test the release build
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb mesa-vulkan-drivers libegl1 libegl-mesa0 \
            libgl1-mesa-dri libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2
          cargo build --release --locked
          status=0
          timeout 15 xvfb-run -a target/release/mind_mapper || status=$?
          echo "exit status: $status (124 = still running when stopped)"
          test "$status" -eq 124

  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # Fails if a dependency uses a license not accepted in about.toml.
      - name: Generate notices
        run: cargo about generate --locked about.hbs -o THIRD_PARTY_NOTICES.txt
